<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>India markets & macro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202e;--mut:#5b6677;--line:#dde1e8;--acc:#0b6e69;--up:#1a7f4b;--dn:#b3372f}
@media(prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#171e28;--ink:#e8ecf2;--mut:#98a3b3;--line:#273041;--acc:#4fc3bb;--up:#52c68a;--dn:#ef7c74}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
nav{display:flex;gap:20px;align-items:baseline;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
nav b{font:600 18px Georgia,serif;margin-right:auto}nav a{color:var(--mut);text-decoration:none}nav a.on{color:var(--acc);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:20px}h1{font:600 28px Georgia,serif;margin:8px 0 4px}.sub{color:var(--mut);margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit}
.chips button.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
h2{font:600 19px Georgia,serif;margin:28px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}.card h3{margin:0;font-size:15px}
.big{font-size:24px;font-weight:600}.chg{font-size:13px;margin-left:6px}.up{color:var(--up)}.dn{color:var(--dn)}
.ch{height:130px;margin:8px 0}.meta{font-size:12px;color:var(--mut)}.meta a{color:var(--mut)}
details{margin-top:8px;font-size:13px}summary{cursor:pointer;color:var(--acc)}details p{margin:6px 0 0}
.empty{height:130px;display:grid;place-items:center;text-align:center;color:var(--mut);font-size:13px;border:1px dashed var(--line);border-radius:6px;margin:8px 0;padding:8px}
</style></head><body>
<nav><b>India markets & macro</b><a href="#">Stocks</a><a class="on" href="#">Macro</a></nav>
<main><h1>Markets & macroeconomy</h1><p class="sub">Ten-year trends. Updated weekly, last build 23 Nov 2026. Open "What this means" on any card for plain-language notes.</p>
<div class="chips" id="chips"></div><div id="root"></div></main>
<script>
const D=[{"id": "nifty", "section": "Market & valuation", "title": "Nifty 50", "unit": "index pts", "source": "NSE via Yahoo Finance", "url": "https://www.nseindia.com/", "freq": "Weekly", "note": "Benchmark of 50 large Indian companies. A bull market is a long, broad uptrend; early-stage ones start with low investor participation and lingering scepticism.", "dates": [], "values": []}, {"id": "sensex", "section": "Market & valuation", "title": "Sensex", "unit": "index pts", "source": "BSE via Yahoo Finance", "url": "https://www.bseindia.com/", "freq": "Weekly", "note": "BSE's 30-stock index. Moves closely with the Nifty; useful as a cross-check.", "dates": [], "values": []}, {"id": "pe", "section": "Market & valuation", "title": "Nifty P/E", "unit": "x", "source": "NSE indices (historical P/E)", "url": "https://www.niftyindices.com/reports/historical-data", "freq": "Monthly", "note": "Price divided by earnings per share. Higher means richer valuation. Compare with bond yields: when yields fall, higher P/E bands can be justified.", "dates": [], "values": []}, {"id": "sip", "section": "Market & valuation", "title": "Monthly SIP inflows", "unit": "\u20b9 crore", "source": "AMFI", "url": "https://www.amfiindia.com/research-information/amfi-monthly", "freq": "Monthly (manual)", "note": "SIP = systematic investment plan. Steady domestic inflows show household participation ('commitment') building up.", "dates": [], "values": []}, {"id": "repo", "section": "Rates & liquidity", "title": "RBI repo rate", "unit": "%", "source": "RBI via BIS policy-rate data", "url": "https://www.rbi.org.in/Scripts/BS_ViewMasCirculardetails.aspx", "freq": "Monthly", "note": "Rate at which RBI lends to banks. Lower rates cut borrowing costs and make equities more attractive relative to deposits.", "dates": [], "values": []}, {"id": "g10", "section": "Rates & liquidity", "title": "India 10-year G-Sec yield", "unit": "%", "source": "FRED (OECD)", "url": "https://fred.stlouisfed.org/series/INDIRLTLT01STM", "freq": "Monthly", "note": "Yield on the government's 10-year bond: the risk-free benchmark. Earnings yield (1/PE) minus this gap shows how well equities pay for their risk.", "dates": [], "values": []}, {"id": "fed", "section": "Rates & liquidity", "title": "US Fed funds rate", "unit": "%", "source": "FRED (Federal Reserve)", "url": "https://fred.stlouisfed.org/series/FEDFUNDS", "freq": "Monthly", "note": "US policy rate. Higher US rates pull global money towards the dollar and can trigger FII outflows from India.", "dates": [], "values": []}, {"id": "us10", "section": "Rates & liquidity", "title": "US 10-year yield", "unit": "%", "source": "CBOE via Yahoo Finance", "url": "https://finance.yahoo.com/quote/%5ETNX", "freq": "Weekly", "note": "Global anchor for borrowing costs. Moves in this yield ripple into emerging-market bonds and currencies.", "dates": [], "values": []}, {"id": "cap", "section": "Earnings & demand", "title": "Capacity utilization", "unit": "%", "source": "RBI OBICUS survey", "url": "https://www.rbi.org.in/Scripts/PublicationsView.aspx?id=22570", "freq": "Quarterly (manual)", "note": "Share of installed industrial capacity in use. Above ~75% firms tend to invest in new plants, lifting capex and earnings.", "dates": [], "values": []}, {"id": "gst", "section": "Earnings & demand", "title": "GST collections", "unit": "\u20b9 lakh crore", "source": "GST Council / PIB", "url": "https://www.gst.gov.in/newsandupdates", "freq": "Monthly (manual)", "note": "Gross goods-and-services-tax revenue: a real-time proxy for economic activity and formalisation.", "dates": [], "values": []}, {"id": "it", "section": "Sectors", "title": "Nifty IT", "unit": "index pts", "source": "NSE via Yahoo Finance", "url": "https://www.niftyindices.com/", "freq": "Weekly", "note": "Large IT exporters earn in dollars, so a weaker rupee helps margins; slowing client tech budgets hurt.", "dates": [], "values": []}, {"id": "pharma", "section": "Sectors", "title": "Nifty Pharma", "unit": "index pts", "source": "NSE via Yahoo Finance", "url": "https://www.niftyindices.com/", "freq": "Weekly", "note": "US FDA compliance and US generic drug pricing are the main swing factors.", "dates": [], "values": []}, {"id": "bank", "section": "Sectors", "title": "Nifty Bank", "unit": "index pts", "source": "NSE via Yahoo Finance", "url": "https://www.niftyindices.com/", "freq": "Weekly", "note": "Banks' profits depend on credit growth and NPAs (non-performing assets: loans unpaid for 90+ days).", "dates": [], "values": []}, {"id": "metal", "section": "Sectors", "title": "Nifty Metal", "unit": "index pts", "source": "NSE via Yahoo Finance", "url": "https://www.niftyindices.com/", "freq": "Weekly", "note": "Cyclical: follows global commodity prices and China demand.", "dates": [], "values": []}, {"id": "auto", "section": "Sectors", "title": "Nifty Auto", "unit": "index pts", "source": "NSE via Yahoo Finance", "url": "https://www.niftyindices.com/", "freq": "Weekly", "note": "Proxy for consumption, rural demand and interest-rate sensitivity (vehicle loans).", "dates": [], "values": []}, {"id": "npa", "section": "Sectors", "title": "Gross NPA ratio, banks", "unit": "%", "source": "World Bank via FRED (RBI report is half-yearly)", "url": "https://www.rbi.org.in/Scripts/PublicationsView.aspx?id=22570", "freq": "Annual", "note": "Bad loans as % of total loans. Rising NPAs force provisions that cut bank profits; 'recognition' means admitting them on the books.", "dates": [], "values": []}, {"id": "brent", "section": "Commodities & currency", "title": "Brent crude", "unit": "USD/bbl", "source": "ICE via Yahoo Finance", "url": "https://fred.stlouisfed.org/series/DCOILBRENTEU", "freq": "Weekly", "note": "India imports most of its oil, so higher crude widens the current account deficit and weakens the rupee. Supply (shale/fracking, OPEC) caps prices.", "dates": [], "values": []}, {"id": "gold", "section": "Commodities & currency", "title": "Gold", "unit": "USD/oz", "source": "COMEX via Yahoo Finance", "url": "https://www.gold.org/goldhub/data", "freq": "Weekly", "note": "Gold pays no interest, so it tends to rise when real rates fall and money is plentiful, and as a hedge against currency weakness.", "dates": [], "values": []}, {"id": "real", "section": "Commodities & currency", "title": "US real 10-year yield", "unit": "%", "source": "FRED (US Treasury)", "url": "https://fred.stlouisfed.org/series/DFII10", "freq": "Daily", "note": "Yield after inflation (TIPS). Plot it against gold: they usually move in opposite directions.", "dates": [], "values": []}, {"id": "inr", "section": "Commodities & currency", "title": "USD/INR", "unit": "\u20b9 per $", "source": "Yahoo Finance", "url": "https://www.rbi.org.in/scripts/ReferenceRateArchive.aspx", "freq": "Weekly", "note": "A rising line means a weaker rupee. Governments sometimes tolerate or encourage depreciation to make exports cheaper and ease debt burdens, at the cost of imported inflation.", "dates": [], "values": []}, {"id": "dxy", "section": "Commodities & currency", "title": "US Dollar Index", "unit": "index", "source": "ICE via Yahoo Finance", "url": "https://finance.yahoo.com/quote/DX-Y.NYB", "freq": "Weekly", "note": "Dollar against a basket of major currencies. A strong dollar usually pressures emerging markets and commodities.", "dates": [], "values": []}, {"id": "fx", "section": "Commodities & currency", "title": "India forex reserves", "unit": "USD bn", "source": "RBI via FRED (excl. gold)", "url": "https://www.rbi.org.in/Scripts/WSSView.aspx", "freq": "Monthly", "note": "Foreign currency RBI holds. A large buffer lets it smooth rupee falls and reassures foreign investors.", "dates": [], "values": []}, {"id": "gdp", "section": "Macro", "title": "India GDP growth", "unit": "% y/y", "source": "FRED (World Bank)", "url": "https://fred.stlouisfed.org/series/NYGDPMKTPKDZGIND", "freq": "Annual", "note": "Real growth of the economy. Sustained 6-7%+ underpins long-term earnings growth.", "dates": [], "values": []}, {"id": "cpi", "section": "Macro", "title": "India CPI inflation", "unit": "% y/y", "source": "FRED (World Bank)", "url": "https://fred.stlouisfed.org/series/FPCPITOTLZGIND", "freq": "Annual", "note": "Consumer price inflation. RBI cuts rates only when inflation is comfortably within its target band.", "dates": [], "values": []}, {"id": "fii", "section": "Flows", "title": "FII net equity flows", "unit": "\u20b9 crore", "source": "NSE provisional data (history builds from first run)", "url": "https://www.fpi.nsdl.co.in/web/Reports/Latest.aspx", "freq": "Monthly (manual)", "note": "FII = foreign institutional investors. They chase global risk appetite and the dollar, so flows are volatile.", "dates": [], "values": []}, {"id": "dii", "section": "Flows", "title": "DII net equity flows", "unit": "\u20b9 crore", "source": "NSE provisional data (history builds from first run)", "url": "https://www.nseindia.com/reports/fii-dii", "freq": "Monthly (manual)", "note": "DII = domestic institutions (mutual funds, insurers). Their steady buying cushions FII selling.", "dates": [], "values": []}, {"id": "cn", "section": "Global", "title": "China GDP growth", "unit": "% y/y", "source": "FRED (World Bank)", "url": "https://fred.stlouisfed.org/series/NYGDPMKTPKDZGCHN", "freq": "Annual", "note": "China drives global metals and oil demand. A slowdown hits commodity prices and emerging-market sentiment.", "dates": [], "values": []}];const secs=[...new Set(D.map(d=>d.section))];let cur="All";
const chips=document.getElementById("chips");
["All",...secs].forEach(s=>{const b=document.createElement("button");b.textContent=s;b.onclick=()=>{cur=s;draw()};chips.append(b)});
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n);
const fmt=v=>v>=1000?v.toLocaleString("en-IN",{maximumFractionDigits:0}):v.toFixed(2);
let charts=[];
function draw(){charts.forEach(c=>c.destroy());charts=[];
 [...chips.children].forEach(b=>b.classList.toggle("on",b.textContent==cur));
 const root=document.getElementById("root");root.innerHTML="";
 secs.filter(s=>cur=="All"||s==cur).forEach(s=>{
  root.insertAdjacentHTML("beforeend",`<h2>${s}</h2><div class="grid" id="g-${s.replace(/\W/g,"")}"></div>`);
  const g=document.getElementById("g-"+s.replace(/\W/g,""));
  D.filter(d=>d.section==s).forEach(d=>{
   const n=d.values.length,last=d.values[n-1],ago=d.values[Math.max(0,n-1-(d.freq.startsWith("Weekly")?52:d.freq.startsWith("Monthly")?12:1))];
   const ch=n>1?((last/ago-1)*100):null,cl=ch>=0?"up":"dn";
   const head=n?`<span class="big">${fmt(last)}</span> <span class="meta">${d.unit}</span>${ch!==null?`<span class="chg ${cl}">${ch>=0?"+":""}${ch.toFixed(1)}% vs 1 period-year ago</span>`:""}`:`<span class="meta">No data yet</span>`;
   const body=n?`<div class="ch"><canvas></canvas></div>`:`<div class="empty">Add rows to data/manual/${d.id}.csv (date,value) or check the source below, then rebuild.</div>`;
   const el=document.createElement("div");el.className="card";
   el.innerHTML=`<h3>${d.title}</h3>${head}${body}<div class="meta">Source: <a href="${d.url}" target="_blank" rel="noopener">${d.source}</a> · ${d.freq}${n?` · latest ${d.dates[n-1]}`:""}</div><details><summary>What this means</summary><p>${d.note}</p></details>`;
   g.append(el);
   if(n)charts.push(new Chart(el.querySelector("canvas"),{type:"line",data:{labels:d.dates,datasets:[{data:d.values,borderColor:css("--acc"),borderWidth:1.6,pointRadius:0,tension:.15}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:6,color:css("--mut"),callback(v){return this.getLabelForValue(v).slice(0,4)}},grid:{display:false}},y:{ticks:{maxTicksLimit:4,color:css("--mut")},grid:{color:css("--line")}}}}}));
  })})}
draw();
</script></body></html>
